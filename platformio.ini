; ESP32-C3 Super Mini 常供电时钟
; 开发板没有单独的 PlatformIO 板型，引脚与 esp32-c3-devkitm-1 一致。
; 多数 Super Mini 使用板载 USB，串口监视需要打开 USB CDC。

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.mcu = esp32c3
board_build.flash_mode = dio
board_build.flash_size = 4MB
upload_speed = 460800
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
